server:
  port: 8889
  tomcat:
    uri-encoding: UTF-8
    max-connections: 2000
    accept-count: 100
    threads:
      max: 600
      min-spare: 30
    accesslog:
      enabled: true
      directory: ${logging.file.path}
      pattern: "%h %l %u %t %r %s %b %D"

spring:
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password: redis123
      timeout: 15s
      lettuce:
        pool:
          max-active: 6
          max-wait: 30s
          max-idle: 6
          min-idle: 2
  cloud:
    nacos:
      discovery:
        watch-delay: 3000
    loadbalancer:
      cache:
        ttl: 3s
      retry:
        retry-on-all-operations: true
        retryable-exceptions:
          - java.net.ConnectException
          - java.net.UnknownHostException
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 3${server.port}
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr}
            data-id: ${spring.application.name}-flow-rule.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow

# 作为微服务Consumer端熔断等配置，并不会在节点异常时飘移。默认是false
#feign:
#  sentinel:
#    enabled: true

management:
  server:
    port: 2${server.port}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      "redis.lettuce": false
    distribution:
      expiry:
        "[http.server.requests]": 10s
        "[http.client.requests]": 10s
      percentiles:
        "http.server.requests": 0.95, 0.99
        "http.client.requests": 0.95, 0.99