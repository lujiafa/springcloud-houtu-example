logging:
  file:
    path: E:/work/tmp/logs/gateway

spring:
  config:
    import:
      - nacos:${spring.application.name}.yaml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        log-name: naming-${spring.application.name}
    sentinel:
      log:
        dir: ${logging.file.path}
